<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PhiPractice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <input id="zipInput" type="file" accept=".zip" />
    <div id="pauseSeek">
      <div class="seek-times"><output id="seekTime" for="musicSeek">0:00</output><span id="musicDuration">0:00</span></div>
      <input id="musicSeek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Music position" disabled />
    </div>
    <button id="settingsButton" type="button" aria-label="Settings" aria-haspopup="dialog" aria-controls="settingsDialog" aria-expanded="false">
      <img src="assets/setting.png" alt="" />
    </button>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog">
        <label class="slider-label" for="noteSpeed">Note speed <output id="noteSpeedValue" for="noteSpeed">9.0</output></label>
        <input id="noteSpeed" type="range" min="1" max="15" step="0.1" value="6" />
        <label class="slider-label" for="globalSpeed">Global speed <output id="globalSpeedValue" for="globalSpeed">1.00×</output></label>
        <input id="globalSpeed" type="range" min="0.5" max="2" step="0.05" value="1" />
        <label class="checkbox-label"><input id="showAccuracy" type="checkbox" checked /> Show acc</label>
        <label class="checkbox-label"><input id="showJudgement" type="checkbox" checked /> Show judgement (±ms)</label>
        <label class="checkbox-label"><input id="showTouchPoints" type="checkbox" checked /> Show finger touch points</label>
        <label class="checkbox-label"><input id="autoplay" type="checkbox" /> Autoplay</label>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
